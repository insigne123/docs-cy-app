[project]
name = "sistema-contratos-licitaciones"
version = "0.1.0"
description = "Sistema de gestión de contratos y licitaciones (Etapa 1: núcleo de datos y motor de estados)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
