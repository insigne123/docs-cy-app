# Blueprint de Render: crea la base Postgres y el servicio web en un solo "Apply".
# https://render.com/docs/blueprint-spec
databases:
  - name: contratos-db
    databaseName: contratos
    user: contratos
    plan: free

services:
  - type: web
    name: contratos-app
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contratos-db
          property: connectionString
      - key: AUTH_REQUIRED
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.7"
